name: RAG-Interview-Agent CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- STAGE 1: Continuous Integration ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.HUGGINGFACEHUB_API_TOKEN }}" ]; then
            echo "⚠️ Warning: HUGGINGFACEHUB_API_TOKEN is missing"
          fi

      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --statistics

  # --- STAGE 2: Deployment (Placeholder) ---
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test  # Only runs if CI passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to your hosting provider..."
          # Add your actual deploy command here (e.g., git push heroku main)

  # --- STAGE 3: Smoke Test ---
  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy  # Only runs after deployment finishes
    steps:
      - name: Wait for service to stabilize
        run: sleep 30 

      - name: Check Health Endpoint
        run: |
          RESPONSE=$(curl -sL -b ""-o /dev/null -w "%{http_code}" ${{ secrets.MY_APP_URL }}/health)
          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Smoke Test Failed: Health check returned $RESPONSE"
            exit 1
          fi
          echo "✅ Smoke Test Passed: Health check returned 200"

      - name: Verify Core API Response
        run: |
          CONTENT=$(curl -s ${{ secrets.MY_APP_URL }}/api/v1/status)
          if [[ "$CONTENT" != *"\"status\":\"ok\""* ]]; then
            echo "❌ Smoke Test Failed: API status is not 'ok'"
            exit 1
          fi