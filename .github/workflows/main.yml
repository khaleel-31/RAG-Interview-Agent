name: RAG-Interview-Agent CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- STAGE 1: Continuous Integration ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 pytest  # Added pytest here

      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --statistics

  # --- STAGE 2: Deployment ---
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to your hosting provider..."
          # Note: If using Streamlit Cloud, this job is just a visual gate.

  # --- STAGE 3: Specialized Streamlit Smoke Test ---
  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Test Dependencies
        run: pip install -r requirements.txt pytest

      - name: Run AppTest Logic
        env:
          # Crucial: These keys allow the 'headless' app to initialize
          HUGGINGFACEHUB_API_TOKEN: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
          MY_APP_URL: ${{ secrets.MY_APP_URL }}
        run: |
          # This executes your test_app.py file
          pytest test_app.py