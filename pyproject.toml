[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-interviewer"
version = "0.1.0"
description = "Pythonic modular Adaptive AI Interview Coach"
authors = [{name = "OpenCode AI"}]

dependencies = [
  "streamlit>=1.0",
  "langgraph",
  "langchain_core",
  "langchain_text_splitters",
  "langchain_huggingface",
  "langchain_chroma",
  "python-dotenv",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
check_untyped_defs = true
